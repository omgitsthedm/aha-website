# Approved website release candidate, October 9, 2026.
# GitHub main is the production source; use the repository's approved merge path.
[build]
  base = "site-preview"
  command = "npm run build"
  publish = "dist"
  functions = "functions-empty"

[build.environment]
  NODE_VERSION = "24.21.0"
  ASTRO_TELEMETRY_DISABLED = "1"
  # Current Next runtime hooks honor this flag. Keep stale UI plugin metadata inert.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.production.environment]
  AHA_PRODUCTION_BUILD = "approved"
  PUBLIC_SITE_URL = "https://afterhoursagenda.com"

[context.deploy-preview.environment]
  PUBLIC_SITE_URL = "https://lfnyc-audit-2026-10-09--afterhoursagenda.netlify.app"

[context.branch-deploy.environment]
  PUBLIC_SITE_URL = "https://lfnyc-audit-2026-10-09--afterhoursagenda.netlify.app"

[functions]
  directory = "functions-empty"
