name: AHA preview checks

on:
  push:
    branches: ["audit/2026-10-09", main]
    paths: ["site-preview/**", "app/api/**", "lib/commerce/**", "lib/square/**", "lib/apliiq/**", "lib/db/**", "db/**", "data/**", "netlify/**", "netlify.toml", ".github/workflows/aha-preview.yml"]
  pull_request:
    branches: [main]
    paths: ["site-preview/**", "app/api/**", "lib/commerce/**", "lib/square/**", "lib/apliiq/**", "lib/db/**", "db/**", "data/**", "netlify/**", "netlify.toml", ".github/workflows/aha-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aha-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-preview
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site-preview/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Verify installed Google Chrome
        run: google-chrome --version
      - run: npm run test:e2e
      - name: Verify production rendering without publishing
        env:
          AHA_PRODUCTION_BUILD: approved
          PUBLIC_SITE_URL: https://afterhoursagenda.com
        run: npm run build && npm test && npm run test:e2e
