name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  AHA_PRODUCTION_BUILD: approved
  PUBLIC_SITE_URL: https://afterhoursagenda.com
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site-preview/package-lock.json
      - run: npm ci
      - name: Validate the deployed storefront, checkout, catalog and fulfillment
        run: npm run check
