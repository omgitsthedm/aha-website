name: e2e

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  AHA_PRODUCTION_BUILD: approved
  PUBLIC_SITE_URL: https://afterhoursagenda.com
  ASTRO_TELEMETRY_DISABLED: "1"

# Existing required check names are retained. They now test the shipped static
# website, including the deliberately absent commerce runtime and unsent support.
jobs:
  product-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site-preview/package-lock.json
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build
      - run: npm run test:e2e -- --grep 'desktop:|mobile:|native mobile|all content|320px|every internal|search ownership'

  cart-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site-preview/package-lock.json
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build
      - run: npm run test:e2e -- --grep 'missing routes and legacy APIs'

  checkout-sandbox-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site-preview/package-lock.json
      - run: npm ci
      - run: google-chrome --version
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e -- --grep 'contact validates'
