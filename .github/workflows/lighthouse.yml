name: lighthouse

on:
  pull_request:
  workflow_dispatch:

env:
  AHA_PREVIEW_CATALOG: "true"
  SQUARE_ENVIRONMENT: sandbox
  AHA_FULFILLMENT_MODE: dry-run
  PRINTFUL_ALLOW_CONFIRM_ORDERS: "false"
  PRINTFUL_LIVE_MODE: "false"

permissions:
  contents: read

# This is repeatable lab evidence, not field CWV: Lighthouse cannot establish INP.
# The mobile profile uses throttled mobile emulation; desktop is captured separately.
# Both run against the credential-free preview catalog, so no production provider or
# checkout action is exercised.
jobs:
  performance:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20.20.2", cache: "npm" }
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/aha-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aha-next.log
          exit 1
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .lighthouserc.${{ matrix.profile }}.json
          urls: |
            http://127.0.0.1:3000/
            http://127.0.0.1:3000/shop
            http://127.0.0.1:3000/product/dont-fuck-fascists-shirt
            http://127.0.0.1:3000/cart
            http://127.0.0.1:3000/checkout
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.profile }}-results
          temporaryPublicStorage: true
