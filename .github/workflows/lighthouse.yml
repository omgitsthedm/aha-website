name: lighthouse

on:
  pull_request:
  workflow_dispatch:

env:
  AHA_PRODUCTION_BUILD: approved
  PUBLIC_SITE_URL: https://afterhoursagenda.com
  ASTRO_TELEMETRY_DISABLED: "1"
  CHROME_PATH: /usr/bin/google-chrome

permissions:
  contents: read

# Required lab checks run on this commit's production artifact in installed
# Google Chrome. Hosted before/after evidence is recorded separately; these are
# local CI budgets, not CDN or field-CWV measurements. No extra Netlify preview.
jobs:
  performance:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: site-preview/package-lock.json
      - run: npm ci --prefix site-preview
      - run: npm run build --prefix site-preview
      - name: Start exact production artifact
        run: |
          google-chrome --version
          node site-preview/scripts/serve.mjs > aha-local-server.log 2>&1 &
          echo "AHA_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:48379/release.json; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .lighthouserc.${{ matrix.profile }}.json
          urls: |
            http://127.0.0.1:48379/
            http://127.0.0.1:48379/about/
            http://127.0.0.1:48379/lookbook/
            http://127.0.0.1:48379/faq/
            http://127.0.0.1:48379/contact/
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-${{ matrix.profile }}-results
          temporaryPublicStorage: false
      - name: Verify performance assertions were executed
        if: always()
        env:
          ASSERTION_RESULTS: ${{ steps.lighthouse.outputs.assertionResults }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.ASSERTION_RESULTS || "[]");
          const requiredAudits = new Set([
            "largest-contentful-paint",
            "cumulative-layout-shift",
            "total-blocking-time",
          ]);
          if (!Array.isArray(results) || results.length < 15) {
            throw new Error(`Expected at least 15 enforced assertions; received ${results.length || 0}`);
          }
          for (const auditId of requiredAudits) {
            if (!results.some((result) => result.auditId === auditId)) {
              throw new Error(`Missing enforced assertion for ${auditId}`);
            }
          }
          const failures = results.filter((result) => result.level === "error" && !result.passed);
          if (failures.length) {
            throw new Error(`${failures.length} performance assertion(s) failed`);
          }
          NODE
      - name: Stop task server
        if: always()
        run: |
          if [[ -n "${AHA_SERVER_PID:-}" ]]; then kill "$AHA_SERVER_PID"; fi
