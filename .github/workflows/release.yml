name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Verifies the tagged static website is live. Read-only: no provider or customer calls.
jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.21.0" }
      - name: Verify live site serves AHA content
        run: node site-preview/scripts/verify-live.mjs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - name: Generate changelog
        run: |
          echo "## ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          git log --pretty=format:'- %s' $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)..HEAD >> RELEASE_NOTES.md || true
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: RELEASE_NOTES.md
